<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - AgriAI</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 8px; width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #10b981; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #059669; }
        .message { margin-top: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reset Password</h2>
        <p style="font-size: 13px; color: #94a3b8;">Enter your registered email to receive a password reset link.</p>
        <input type="email" id="email" placeholder="Enter your email" required />
        <button onclick="requestReset()">Send Reset Link</button>
        <div id="message" class="message"></div>
    </div>

    <script>
        async function requestReset() {
            const email = document.getElementById('email').value;
            const msgDiv = document.getElementById('message');
            msgDiv.style.color = '#cbd5e1';
            msgDiv.innerText = 'Sending request...';

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                msgDiv.style.color = '#34d399';
                msgDiv.innerText = data.message;
            } catch (err) {
                msgDiv.style.color = '#f87171';
                msgDiv.innerText = 'Connection error. Please try again.';
            }
        }
    </script>
</body>
</html>
